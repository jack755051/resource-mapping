server {
    listen 80;
    server_name localhost;

    # 靜態檔案根目錄 (對應 Dockerfile 裡的複製路徑)
    root /usr/share/nginx/html;
    index index.html;

    # === Gzip 壓縮 (減少傳輸大小) ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # === 1. 處理 SPA 路由 (重要) ===
    # 讓重新整理頁面時，不會噴 404，而是回到 index.html 讓 React 接手
    location / {
        try_files $uri $uri/ /index.html;

        # 快取靜態資源 (HTML 不快取，確保始終獲取最新版本)
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # === 快取靜態資源 (JS, CSS, 圖片) ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # === 2. API 反向代理 (解決 CORS) ===
    # 當瀏覽器打 /api/v1/... 時，轉發給後端 Nginx
    location /api/ {
        # ★ 這裡填你後端 OrbStack 的網址 (根據你之前的截圖)
        # 或者是 http://host.docker.internal 如果你在本機
        proxy_pass http://nginx.resource-mapping-backend.orb.local;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 避免 Nginx 自動幫你加斜線導致路徑錯誤
        proxy_redirect off;
    }
}
server {
    listen 80;
    server_name localhost;

    # 靜態檔案根目錄 (對應 Dockerfile 裡的複製路徑)
    root /usr/share/nginx/html;
    index index.html;

    # === 1. 處理 SPA 路由 (重要) ===
    # 讓重新整理頁面時，不會噴 404，而是回到 index.html 讓 React 接手
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === 2. API 反向代理 (解決 CORS) ===
    # 當瀏覽器打 /api/v1/... 時，轉發給後端 Nginx
    location /api/ {
        # ★ 這裡填你後端 OrbStack 的網址 (根據你之前的截圖)
        # 或者是 http://host.docker.internal 如果你在本機
        proxy_pass http://nginx.resource-mapping-backend.orb.local;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 避免 Nginx 自動幫你加斜線導致路徑錯誤
        proxy_redirect off;
    }
}
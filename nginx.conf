server {
    listen 80;
    server_name localhost;
    
    # 靜態檔案位置
    root /usr/share/nginx/html;
    index index.html;

    # 開啟 Gzip (這很好，保持開啟)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA 路由支援 + Next.js Static Export 支援
    location / {
        # ★ 關鍵修改：加入了 $uri.html
        # 1. $uri      -> 找是否有完全符合的檔案 (例如 logo.png)
        # 2. $uri.html -> 找是否有同名的 HTML 檔 (例如 /about -> 讀取 /about.html) <--- 這行解決您的問題
        # 3. $uri/     -> 找目錄
        # 4. /index.html -> 如果都沒找到，回傳首頁 (SPA 路由)
        try_files $uri $uri.html $uri/ /index.html;
    }

    # API 反向代理
    # 注意：在您的 Docker Compose 架構下，最外層的 Gateway Nginx 其實已經把 /api/ 攔截並轉給後端了
    # 所以流量實際上「不會」進到這裡。但留著這段也沒壞處 (方便您單獨測試前端容器時使用)。
    location /api/ {
        proxy_pass http://backend:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}